<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#D21A4E"/>
      <stop offset="1" stop-color="#66082B"/>
    </radialGradient>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C88A5A"/>
      <stop offset="1" stop-color="#9A5E34"/>
    </linearGradient>
    <linearGradient id="hr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241E24"/>
      <stop offset="1" stop-color="#0F0B10"/>
    </linearGradient>
    <clipPath id="cl"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
    <!-- jersey: Spain red + yellow -->
    <path d="M36 256 V226 Q128 188 220 226 V256 Z" fill="#C60B1E" stroke="#4d0512" stroke-width="6"/>
    <path d="M60 220 q68 20 136 0" fill="none" stroke="#FFC400" stroke-width="8" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M110 184 h36 v22 q-18 12 -36 0 Z" fill="url(#sk)" stroke="#7A4526" stroke-width="5"/>
    <!-- ears -->
    <circle cx="74" cy="126" r="12" fill="url(#sk)" stroke="#7A4526" stroke-width="5"/>
    <circle cx="182" cy="126" r="12" fill="url(#sk)" stroke="#7A4526" stroke-width="5"/>
    <!-- head -->
    <ellipse cx="128" cy="122" rx="55" ry="59" fill="url(#sk)" stroke="#7A4526" stroke-width="5"/>
    <!-- curly hair: cluster of bumps on top, integrated -->
    <g fill="url(#hr)" stroke="#0c0810" stroke-width="3.5">
      <path d="M70 110 Q62 66 96 60 Q112 46 140 54 Q176 50 186 88 Q194 104 184 118
               Q182 96 168 90 Q176 78 160 74 Q150 88 150 96 Q150 74 132 72
               Q114 74 112 92 Q108 76 120 70 Q96 72 96 92 Q86 84 84 100
               Q78 96 70 110 Z"/>
    </g>
    <circle cx="86" cy="96" r="10" fill="#1a151c"/>
    <circle cx="128" cy="66" r="11" fill="#1a151c"/>
    <circle cx="166" cy="86" r="10" fill="#1a151c"/>
    <!-- eyebrows -->
    <path d="M92 104 q17 -7 33 1" fill="none" stroke="#17121a" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M131 105 q17 -8 33 0" fill="none" stroke="#17121a" stroke-width="8.5" stroke-linecap="round"/>
    <!-- big eyes -->
    <ellipse cx="108" cy="122" rx="15" ry="17" fill="#fff" stroke="#241a12" stroke-width="3.5"/>
    <ellipse cx="148" cy="122" rx="15" ry="17" fill="#fff" stroke="#241a12" stroke-width="3.5"/>
    <circle cx="110" cy="125" r="8" fill="#20160e"/>
    <circle cx="150" cy="125" r="8" fill="#20160e"/>
    <circle cx="113" cy="121" r="2.8" fill="#fff"/>
    <circle cx="153" cy="121" r="2.8" fill="#fff"/>
    <!-- nose -->
    <path d="M128 130 q-5 11 -1 17 q4 3 8 0" fill="none" stroke="#8A5230" stroke-width="4.5" stroke-linecap="round"/>
    <!-- big confident smile -->
    <path d="M104 158 Q128 178 152 158" fill="none" stroke="#3a2010" stroke-width="5" stroke-linecap="round"/>
    <path d="M108 160 Q128 172 148 160 Z" fill="#fff"/>
  </g>
</svg>
