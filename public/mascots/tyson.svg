<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#5A5A6A"/>
      <stop offset="1" stop-color="#1E1E28"/>
    </radialGradient>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2A06E"/>
      <stop offset="1" stop-color="#A87646"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A5A"/>
      <stop offset="1" stop-color="#C21F1F"/>
    </linearGradient>
    <clipPath id="cl"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
    <!-- shoulders -->
    <path d="M28 256 V224 Q128 186 228 224 V256 Z" fill="#2A2E38" stroke="#16181f" stroke-width="6"/>
    <!-- boxing gloves near shoulders -->
    <g stroke="#7a1414" stroke-width="4">
      <ellipse cx="44" cy="212" rx="30" ry="26" fill="url(#gl)"/>
      <ellipse cx="212" cy="212" rx="30" ry="26" fill="url(#gl)"/>
    </g>
    <path d="M30 206 q14 -9 28 0" fill="none" stroke="#ffd0d0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M198 206 q14 -9 28 0" fill="none" stroke="#ffd0d0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <!-- thick neck -->
    <path d="M104 182 h48 v22 q-24 14 -48 0 Z" fill="url(#sk)" stroke="#7A5230" stroke-width="5"/>
    <!-- ears -->
    <circle cx="72" cy="126" r="12" fill="url(#sk)" stroke="#7A5230" stroke-width="5"/>
    <circle cx="184" cy="126" r="12" fill="url(#sk)" stroke="#7A5230" stroke-width="5"/>
    <!-- bald head -->
    <path d="M70 118 Q70 58 128 56 Q186 58 186 118 Q186 164 156 182 Q128 194 100 182 Q70 164 70 118 Z" fill="url(#sk)" stroke="#7A5230" stroke-width="5"/>
    <!-- scalp shine -->
    <ellipse cx="112" cy="80" rx="26" ry="13" fill="#fff" opacity="0.16"/>
    <!-- iconic tribal tattoo around left eye (viewer right) -->
    <g stroke="#20160E" stroke-linecap="round" fill="none">
      <path d="M150 92 Q170 96 176 116 Q178 130 168 140" stroke-width="7"/>
      <path d="M158 100 Q170 106 172 120" stroke-width="4.5"/>
      <path d="M150 138 Q160 142 166 136" stroke-width="4.5"/>
    </g>
    <!-- thick brows -->
    <path d="M90 108 q18 -6 34 2" fill="none" stroke="#2A1D12" stroke-width="9" stroke-linecap="round"/>
    <path d="M132 110 q18 -8 34 -2" fill="none" stroke="#2A1D12" stroke-width="9" stroke-linecap="round"/>
    <!-- big eyes, calm-serious -->
    <ellipse cx="108" cy="126" rx="15" ry="16" fill="#fff" stroke="#2a1e14" stroke-width="3.5"/>
    <ellipse cx="150" cy="126" rx="15" ry="16" fill="#fff" stroke="#2a1e14" stroke-width="3.5"/>
    <circle cx="110" cy="128" r="7.5" fill="#221812"/>
    <circle cx="152" cy="128" r="7.5" fill="#221812"/>
    <circle cx="113" cy="124" r="2.6" fill="#fff"/>
    <circle cx="155" cy="124" r="2.6" fill="#fff"/>
    <!-- nose -->
    <path d="M128 132 q-6 11 -1 17 q5 3 9 0" fill="none" stroke="#8A5A34" stroke-width="5" stroke-linecap="round"/>
    <!-- calm friendly mouth -->
    <path d="M112 162 Q128 170 144 162" fill="none" stroke="#3a2413" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
