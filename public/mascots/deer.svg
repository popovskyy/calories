<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!--
    Маскот «99 ночей у лісі»: гуманоїдний олень як у грі —
    темна морда, гіллясті чорні роги, великі очі (cream → blood red).
  -->
  <defs>
    <radialGradient id="bg" cx="42%" cy="28%" r="82%">
      <stop offset="0" stop-color="#1a2e24"/>
      <stop offset="0.55" stop-color="#0c1612"/>
      <stop offset="1" stop-color="#060908"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="100%" r="55%">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".38"/>
      <stop offset="0.55" stop-color="#ff6a1f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3220"/>
      <stop offset="0.5" stop-color="#2a1a0f"/>
      <stop offset="1" stop-color="#160c05"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1108"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <style>
    .eye {
      fill: #f7f2ea;
      animation: eyeHaunt 5.5s ease-in-out infinite;
    }
    .pupil {
      fill: #0f0904;
      animation: pupilPulse 5.5s ease-in-out infinite;
    }
    .eyeGlow {
      animation: glowHaunt 5.5s ease-in-out infinite;
    }
    .antler {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: antlerSway 7s ease-in-out infinite;
    }
    .antlerR { animation-delay: -1.2s; }
    .ember1 { animation: emberFloat 3.2s ease-in infinite; }
    .ember2 { animation: emberFloat 3.8s ease-in infinite .7s; }
    .ember3 { animation: emberFloat 4.4s ease-in infinite 1.4s; }
    .moon { animation: moonPulse 8s ease-in-out infinite; }

    @keyframes eyeHaunt {
      0%, 62%, 100% { fill: #f7f2ea; }
      72%, 86% { fill: #ff3b2f; }
      78% { fill: #ffd166; }
    }
    @keyframes pupilPulse {
      0%, 62%, 100% { fill: #0f0904; transform: scale(1); }
      72%, 86% { fill: #1a0504; transform: scale(0.82); }
    }
    @keyframes glowHaunt {
      0%, 62%, 100% { opacity: 0.15; }
      72%, 86% { opacity: 0.85; }
    }
    @keyframes antlerSway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes emberFloat {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      15% { opacity: 0.9; }
      100% { transform: translate(6px, -36px) scale(0.35); opacity: 0; }
    }
    @keyframes moonPulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.38; }
    }

    @media (prefers-reduced-motion: reduce) {
      .eye, .pupil, .eyeGlow, .antler, .ember1, .ember2, .ember3, .moon {
        animation: none !important;
      }
      .eye { fill: #f7f2ea; }
      .eyeGlow { opacity: 0.25; }
    }
  </style>

  <g clip-path="url(#clip)">
    <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
    <circle cx="128" cy="128" r="128" fill="url(#fireGlow)"/>

    <!-- місяць -->
    <circle class="moon" cx="198" cy="48" r="18" fill="#d8e8ff"/>
    <!-- силуети ялинок -->
    <path d="M28 96 l14 42 h-28z" fill="#07110c" opacity=".7"/>
    <path d="M48 108 l10 30 h-20z" fill="#0a1610" opacity=".55"/>
    <path d="M214 100 l12 38 h-24z" fill="#07110c" opacity=".6"/>

    <!-- іскри від вогнища -->
    <circle class="ember1" cx="108" cy="236" r="3" fill="#ffb347"/>
    <circle class="ember2" cx="140" cy="240" r="2.5" fill="#ff8a3d"/>
    <circle class="ember3" cx="124" cy="232" r="2" fill="#ffe9a8"/>

    <!-- роги (чорні, гіллясті — як у грі) -->
    <g class="antler" fill="none" stroke="#080503" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M92 92 C86 68 74 48 56 28"/>
      <path d="M78 56 L54 50"/>
      <path d="M72 44 L66 22"/>
      <path d="M86 74 L64 72"/>
    </g>
    <g class="antler antlerR" fill="none" stroke="#080503" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M164 92 C170 68 182 48 200 28"/>
      <path d="M178 56 L202 50"/>
      <path d="M184 44 L190 22"/>
      <path d="M170 74 L192 72"/>
    </g>

    <!-- вуха -->
    <path d="M72 108 Q58 72 78 64 Q92 78 90 112 Z" fill="#2a1a0f"/>
    <path d="M184 108 Q198 72 178 64 Q164 78 166 112 Z" fill="#2a1a0f"/>
    <path d="M76 104 Q68 80 80 76 Q86 88 86 108 Z" fill="#b5717d"/>
    <path d="M180 104 Q188 80 176 76 Q170 88 170 108 Z" fill="#b5717d"/>

    <!-- голова -->
    <ellipse cx="128" cy="128" rx="58" ry="56" fill="url(#fur)"/>
    <!-- легка тінь чола -->
    <ellipse cx="128" cy="108" rx="44" ry="28" fill="#1b1008" opacity=".35"/>

    <!-- морда (прямокутна, як у грі) -->
    <rect x="108" y="148" width="40" height="52" rx="14" fill="url(#muzzle)" stroke="#5c3f2c" stroke-width="3"/>
    <ellipse cx="128" cy="152" rx="16" ry="11" fill="#1d1108"/>
    <ellipse cx="128" cy="150" rx="7" ry="4" fill="#3a2517"/>

    <!-- світіння очей (червоніє разом із зіницями) -->
    <ellipse class="eyeGlow" cx="100" cy="122" rx="28" ry="26" fill="#ff3b2f"/>
    <ellipse class="eyeGlow" cx="156" cy="122" rx="28" ry="26" fill="#ff3b2f"/>

    <!-- великі очі -->
    <circle class="eye" cx="100" cy="122" r="24"/>
    <circle class="eye" cx="156" cy="122" r="24"/>
    <circle class="pupil" cx="100" cy="124" r="9" style="transform-origin: 100px 124px; transform-box: fill-box"/>
    <circle class="pupil" cx="156" cy="124" r="9" style="transform-origin: 156px 124px; transform-box: fill-box"/>
    <!-- блік -->
    <circle cx="92" cy="114" r="5" fill="#fff" opacity=".55"/>
    <circle cx="148" cy="114" r="5" fill="#fff" opacity=".55"/>

    <!-- брови / тінь над очима -->
    <path d="M78 100 Q100 92 118 102" fill="none" stroke="#120a05" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <path d="M138 102 Q156 92 178 100" fill="none" stroke="#120a05" stroke-width="5" stroke-linecap="round" opacity=".7"/>

    <!-- комір / плечі внизу круга -->
    <path d="M48 256 V214 Q128 188 208 214 V256 Z" fill="#160c05"/>
    <path d="M48 256 V220 Q128 198 208 220 V256 Z" fill="#241608"/>
    <path d="M92 208 q36 14 72 0" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  </g>
</svg>
