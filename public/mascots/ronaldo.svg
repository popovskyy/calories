<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!--
    Маскот «Роналду»: нічний стадіон, прожектори, фірмовий кіф, упевнена
    усмішка, комір Португалії з «7». Стиль deer.svg: сцена + легка анімація.
  -->
  <defs>
    <radialGradient id="r-bg" cx="50%" cy="24%" r="88%">
      <stop offset="0" stop-color="#0f5c38"/>
      <stop offset="0.55" stop-color="#07351f"/>
      <stop offset="1" stop-color="#02150c"/>
    </radialGradient>
    <linearGradient id="r-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efc49c"/>
      <stop offset="0.6" stop-color="#d8a074"/>
      <stop offset="1" stop-color="#b8814f"/>
    </linearGradient>
    <linearGradient id="r-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38291b"/>
      <stop offset="1" stop-color="#140d06"/>
    </linearGradient>
    <linearGradient id="r-kit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b1421"/>
      <stop offset="1" stop-color="#5e0a12"/>
    </linearGradient>
    <clipPath id="r-clip">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <style>
    .r-eye { transform-box: fill-box; transform-origin: center; animation: rBlink 5.5s ease-in-out infinite; }
    .r-flood { animation: rFlood 6s ease-in-out infinite; }
    .r-flood2 { animation-delay: -3s; }
    .r-stand { animation: rStand 8s ease-in-out infinite; }
    @keyframes rBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      94.5% { transform: scaleY(0.08); }
    }
    @keyframes rFlood {
      0%, 100% { opacity: .5; }
      50% { opacity: .95; }
    }
    @keyframes rStand {
      0%, 100% { opacity: .25; }
      50% { opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .r-eye, .r-flood, .r-flood2, .r-stand { animation: none !important; }
    }
  </style>

  <g clip-path="url(#r-clip)">
    <circle cx="128" cy="128" r="128" fill="url(#r-bg)"/>

    <!-- прожектори стадіону -->
    <g class="r-flood">
      <path d="M30 30 l10 -12 M40 34 l12 -10 M26 42 l8 -14" stroke="#eaf6ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="34" cy="34" r="7" fill="#eaf6ff"/>
    </g>
    <g class="r-flood r-flood2">
      <path d="M226 30 l-10 -12 M216 34 l-12 -10 M230 42 l-8 -14" stroke="#eaf6ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="222" cy="34" r="7" fill="#eaf6ff"/>
    </g>
    <!-- трибуни -->
    <path class="r-stand" d="M0 84 q64 -18 128 0 q64 18 128 0 v14 q-64 16 -128 0 q-64 -16 -128 0z" fill="#0a1f14"/>

    <!-- вуха -->
    <ellipse cx="74" cy="142" rx="9" ry="13" fill="#d8a074"/>
    <ellipse cx="182" cy="142" rx="9" ry="13" fill="#d8a074"/>

    <!-- голова: гостре підборіддя -->
    <path d="M76 138 Q76 88 128 84 Q180 88 180 138 Q180 176 155 190 Q128 202 101 190 Q76 176 76 138Z" fill="url(#r-skin)" stroke="#a87850" stroke-width="2.5"/>

    <!-- волосся поверх чола + фірмовий кіф -->
    <path d="M74 124 Q72 62 128 56 Q184 62 182 124 L174 126 Q174 96 128 92 Q82 96 82 126 Z" fill="url(#r-hair)"/>
    <path d="M98 64 q4 -20 28 -18 q-4 -12 -20 -8 q-16 4 -8 26z" fill="url(#r-hair)"/>
    <path d="M92 74 q14 -10 34 -10" stroke="#4a3826" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>

    <!-- брови — гострі, впевнені -->
    <path d="M92 120 q17 -11 34 -3" fill="none" stroke="#1d140b" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M130 117 q17 -8 34 3" fill="none" stroke="#1d140b" stroke-width="6.5" stroke-linecap="round"/>

    <!-- очі -->
    <g class="r-eye">
      <ellipse cx="108" cy="138" rx="13" ry="14" fill="#fff"/>
      <circle cx="110" cy="141" r="6.5" fill="#33260f"/>
      <circle cx="112.5" cy="138" r="2.2" fill="#fff"/>
    </g>
    <g class="r-eye" style="animation-delay:-.12s">
      <ellipse cx="148" cy="138" rx="13" ry="14" fill="#fff"/>
      <circle cx="146" cy="141" r="6.5" fill="#33260f"/>
      <circle cx="148.5" cy="138" r="2.2" fill="#fff"/>
    </g>

    <!-- ніс -->
    <path d="M124 148 q4 10 8 0 q0 8 -4 8 q-4 0 -4 -8z" fill="#c08a5c"/>

    <!-- широка усмішка -->
    <path d="M100 168 q28 24 56 0 q-6 16 -28 19 q-22 -3 -28 -19z" fill="#7a4028"/>
    <path d="M108 171 q20 12 40 0 l-3 7 q-17 8 -34 0 z" fill="#fff"/>
    <path d="M96 164 q2 6 8 9 M160 164 q-2 6 -8 9" stroke="#b8824f" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>

    <!-- легка щетина -->
    <path d="M100 178 q28 20 56 0 q-4 14 -28 17 q-24 -3 -28 -17z" fill="#1d140b" opacity=".12"/>

    <!-- комір збірної з 7 -->
    <path d="M42 256 V214 Q128 186 214 214 V256 Z" fill="url(#r-kit)"/>
    <path d="M42 256 V220 Q128 196 214 220 V256 Z" fill="none" stroke="#0f5c38" stroke-width="5" opacity=".8"/>
    <path d="M112 214 q16 8 32 0 l-4 10 q-12 6 -24 0 z" fill="#e8c86a"/>
    <text x="128" y="248" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#e8c86a">7</text>
  </g>
</svg>
