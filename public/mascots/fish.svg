<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="water" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#2e7fa6"/>
      <stop offset="1" stop-color="#04202e"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#ffa14a"/>
      <stop offset="1" stop-color="#e4632b"/>
    </linearGradient>
    <linearGradient id="tailG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset=".45" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#2bd7e8"/>
    </linearGradient>
    <linearGradient id="finG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee9ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff0ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#bff0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubbleG" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#cdefff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8fd8f5" stop-opacity=".22"/>
    </radialGradient>
  </defs>

  <style>
    .anim { transform-box: view-box; }
    .swim   { animation: swim 4.2s ease-in-out infinite; transform-origin: 128px 128px; }
    .wag    { animation: wag 1.1s ease-in-out infinite; transform-origin: 104px 128px; }
    .dorsal { animation: wag 1.6s ease-in-out infinite; transform-origin: 128px 100px; }
    .anal   { animation: wag 1.4s ease-in-out infinite; transform-origin: 128px 156px; }
    .pect   { animation: flap 0.85s ease-in-out infinite; transform-origin: 150px 140px; }
    .mouth  { animation: gulp 3.4s ease-in-out infinite; transform-origin: 174px 136px; }
    .b1 { animation: rise 3.4s ease-in infinite; }
    .b2 { animation: rise 3.4s ease-in infinite 1.1s; }
    .b3 { animation: rise 3.4s ease-in infinite 2.2s; }
    .b4 { animation: drift 7s ease-in-out infinite; }
    .b5 { animation: drift 9s ease-in-out infinite 2.5s; }
    .weed1 { animation: sway 5.2s ease-in-out infinite; transform-origin: 58px 232px; }
    .weed2 { animation: sway 6.4s ease-in-out infinite .8s; transform-origin: 200px 234px; }
    .rays  { animation: shine 6s ease-in-out infinite; }

    @keyframes swim {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25%      { transform: translate(3px, -5px) rotate(-2.5deg); }
      50%      { transform: translate(0, 0) rotate(0deg); }
      75%      { transform: translate(-3px, 5px) rotate(2.5deg); }
    }
    @keyframes wag  { 0%, 100% { transform: rotate(8deg); }  50% { transform: rotate(-8deg); } }
    @keyframes flap { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(16deg); } }
    @keyframes gulp { 0%, 62%, 100% { transform: scale(1); } 74% { transform: scale(1, 2.6); } }
    @keyframes rise {
      0%   { transform: translate(0, 0) scale(.35); opacity: 0; }
      12%  { opacity: .85; }
      70%  { opacity: .55; }
      100% { transform: translate(16px, -92px) scale(1.2); opacity: 0; }
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0); opacity: .25; }
      50%      { transform: translate(4px, -10px); opacity: .5; }
    }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes shine { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
    }
  </style>

  <circle cx="128" cy="128" r="120" fill="url(#water)"/>

  <!-- sun rays through the water -->
  <g class="anim rays">
    <path d="M96 8 L76 130 L104 130 L116 8z" fill="url(#rayG)"/>
    <path d="M150 10 L146 126 L166 126 L176 12z" fill="url(#rayG)" opacity=".7"/>
  </g>

  <!-- sea floor + weeds -->
  <path d="M18 214 q40 -18 110 -12 q70 6 110 12 v42 h-220z" fill="#0a3346" opacity=".85"/>
  <path d="M22 226 q46 -14 106 -9 q66 5 106 9 v30 h-212z" fill="#0d4258" opacity=".9"/>
  <g class="anim weed1">
    <path d="M58 232 C48 208 62 194 56 176 C70 192 66 212 66 232z" fill="#1c7a5e" opacity=".75"/>
  </g>
  <g class="anim weed2">
    <path d="M200 234 C192 212 204 198 198 182 C212 198 208 216 208 234z" fill="#1c7a5e" opacity=".6"/>
  </g>

  <!-- ambient bubbles -->
  <circle class="anim b4" cx="52" cy="96" r="4" fill="url(#bubbleG)"/>
  <circle class="anim b5" cx="212" cy="150" r="3" fill="url(#bubbleG)"/>

  <g class="anim swim">
    <!-- veil tail -->
    <g class="anim wag">
      <path d="M104 128
               C84 104 58 90 38 84
               C50 106 50 150 38 172
               C58 166 84 152 104 128z"
            fill="url(#tailG)" stroke="#5b3fa8" stroke-width="2" opacity=".95"/>
      <path d="M100 128 C82 112 62 100 46 94" stroke="#ffffff" stroke-width="1.6" opacity=".3" stroke-linecap="round"/>
      <path d="M100 128 C82 124 62 118 46 114" stroke="#ffffff" stroke-width="1.6" opacity=".25" stroke-linecap="round"/>
      <path d="M100 130 C82 138 62 148 46 156" stroke="#ffffff" stroke-width="1.6" opacity=".25" stroke-linecap="round"/>
    </g>

    <!-- dorsal fin -->
    <g class="anim dorsal">
      <path d="M124 102 C118 84 126 70 142 62 C144 80 140 94 138 102z" fill="url(#finG)" stroke="#4a37a6" stroke-width="1.8"/>
    </g>
    <!-- anal fin -->
    <g class="anim anal">
      <path d="M122 154 C116 170 120 180 130 186 C134 174 132 162 132 154z" fill="url(#finG)" stroke="#4a37a6" stroke-width="1.8"/>
    </g>

    <!-- guppy body -->
    <path d="M174 130
             C174 111 155 98 133 98
             C112 98 97 111 97 129
             C97 147 112 160 133 160
             C155 160 174 148 174 130z"
          fill="url(#bodyG)" stroke="#b8481f" stroke-width="2.5"/>

    <!-- belly + scales -->
    <path d="M104 140 q28 22 66 4 q-24 20 -50 16 q-14 -6 -16 -20z" fill="#fff0c2" opacity=".45"/>
    <path d="M112 116 a10 10 0 0 1 10 10" stroke="#ffffff" stroke-width="2" opacity=".3" fill="none" stroke-linecap="round"/>
    <path d="M124 110 a10 10 0 0 1 10 10" stroke="#ffffff" stroke-width="2" opacity=".25" fill="none" stroke-linecap="round"/>
    <path d="M136 108 a10 10 0 0 1 10 10" stroke="#ffffff" stroke-width="2" opacity=".2" fill="none" stroke-linecap="round"/>
    <ellipse cx="116" cy="134" rx="6" ry="5" fill="#e4632b" opacity=".35"/>
    <ellipse cx="132" cy="142" rx="5" ry="4" fill="#e4632b" opacity=".3"/>

    <!-- pectoral fin -->
    <g class="anim pect">
      <path d="M151 141 C143 148 139 156 142 162 C149 158 153 150 155 143z" fill="#ffcf96" stroke="#c9762f" stroke-width="1.5" opacity=".8"/>
      <path d="M151 144 C146 149 143 154 143 159" fill="none" stroke="#c9762f" stroke-width="1" opacity=".45"/>
    </g>

    <!-- big eye -->
    <ellipse cx="157" cy="122" rx="12" ry="13" fill="#1a1008"/>
    <ellipse cx="157.5" cy="123" rx="6" ry="7" fill="#7de6ff"/>
    <circle cx="160" cy="120" r="2.4" fill="#fff"/>
    <path d="M147 108 q10 -6 20 1" fill="none" stroke="#a8471c" stroke-width="3" stroke-linecap="round" opacity=".75"/>

    <!-- mouth -->
    <g class="anim mouth">
      <ellipse cx="174" cy="136" rx="4.5" ry="3" fill="#8c3312"/>
      <ellipse cx="174" cy="135" rx="2.4" ry="1.4" fill="#ffb08a" opacity=".6"/>
    </g>

    <!-- gill line -->
    <path d="M144 112 q-7 18 2 34" fill="none" stroke="#c9762f" stroke-width="2" opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- bubble stream from the mouth -->
  <g transform="translate(182 132)">
    <circle class="anim b1" r="4.5" fill="url(#bubbleG)" stroke="#dff4ff" stroke-width=".8" stroke-opacity=".5"/>
    <circle class="anim b2" r="3" fill="url(#bubbleG)" stroke="#dff4ff" stroke-width=".8" stroke-opacity=".45"/>
    <circle class="anim b3" r="5.5" fill="url(#bubbleG)" stroke="#dff4ff" stroke-width=".8" stroke-opacity=".5"/>
  </g>

  <path d="M60 82 a56 54 0 0 1 40 -30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".18"/>
</svg>
