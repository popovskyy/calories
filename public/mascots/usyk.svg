<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!--
    Маскот «Усік»: нічний ринг, промені прожекторів, вуса, щербата усмішка,
    синьо-жовтий комір і рукавички. Стиль як deer.svg: сцена + легка анімація.
  -->
  <defs>
    <radialGradient id="u-bg" cx="50%" cy="26%" r="85%">
      <stop offset="0" stop-color="#2a6db5"/>
      <stop offset="0.55" stop-color="#123a66"/>
      <stop offset="1" stop-color="#071626"/>
    </radialGradient>
    <linearGradient id="u-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d0ad"/>
      <stop offset="0.6" stop-color="#e0b088"/>
      <stop offset="1" stop-color="#c08c5e"/>
    </linearGradient>
    <linearGradient id="u-ua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0057b7"/>
      <stop offset=".5" stop-color="#0057b7"/>
      <stop offset=".5" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="u-glove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
    <clipPath id="u-clip">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <style>
    .u-eye { transform-box: fill-box; transform-origin: center; animation: uBlink 6s ease-in-out infinite; }
    .u-beam { animation: uBeam 7s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    .u-beam2 { animation-delay: -3.5s; }
    .u-spark { animation: uSpark 4s ease-in-out infinite; }
    @keyframes uBlink {
      0%, 93%, 100% { transform: scaleY(1); }
      95.5% { transform: scaleY(0.08); }
    }
    @keyframes uBeam {
      0%, 100% { opacity: .18; transform: rotate(-4deg); }
      50% { opacity: .4; transform: rotate(5deg); }
    }
    @keyframes uSpark {
      0%, 100% { opacity: .25; }
      50% { opacity: .8; }
    }
    @media (prefers-reduced-motion: reduce) {
      .u-eye, .u-beam, .u-beam2, .u-spark { animation: none !important; }
    }
  </style>

  <g clip-path="url(#u-clip)">
    <circle cx="128" cy="128" r="128" fill="url(#u-bg)"/>

    <!-- прожектори рингу -->
    <path class="u-beam" d="M60 -8 L28 128 L96 128 Z" fill="#bfe0ff"/>
    <path class="u-beam u-beam2" d="M196 -8 L160 128 L228 128 Z" fill="#bfe0ff"/>
    <circle class="u-spark" cx="36" cy="52" r="3" fill="#ffd700"/>
    <circle class="u-spark" cx="222" cy="66" r="2.5" fill="#ffd700" style="animation-delay:-2s"/>

    <!-- канати рингу -->
    <path d="M0 176 H256" stroke="#c9435a" stroke-width="4" opacity=".5"/>
    <path d="M0 192 H256" stroke="#e8e8f0" stroke-width="3" opacity=".3"/>

    <!-- вуха -->
    <ellipse cx="72" cy="140" rx="9" ry="13" fill="#e0b088"/>
    <ellipse cx="184" cy="140" rx="9" ry="13" fill="#e0b088"/>

    <!-- голова -->
    <ellipse cx="128" cy="136" rx="54" ry="56" fill="url(#u-skin)" stroke="#a87850" stroke-width="2.5"/>

    <!-- коротка стрижка поверх чола + оселедець -->
    <path d="M74 118 Q74 60 128 56 Q182 60 182 118 L174 120 Q172 92 128 88 Q84 92 82 120 Z" fill="#241a12"/>
    <path d="M120 60 q4 -14 2 -24 q14 6 12 24 z" fill="#241a12"/>

    <!-- брови — важкі, боксерські -->
    <path d="M92 116 q17 -9 34 -1" fill="none" stroke="#241a12" stroke-width="7" stroke-linecap="round"/>
    <path d="M130 115 q17 -8 34 1" fill="none" stroke="#241a12" stroke-width="7" stroke-linecap="round"/>

    <!-- очі -->
    <g class="u-eye">
      <ellipse cx="108" cy="136" rx="14" ry="15" fill="#fff"/>
      <circle cx="111" cy="139" r="7" fill="#241a12"/>
      <circle cx="113.5" cy="136" r="2.4" fill="#fff"/>
    </g>
    <g class="u-eye" style="animation-delay:-.1s">
      <ellipse cx="148" cy="136" rx="14" ry="15" fill="#fff"/>
      <circle cx="145" cy="139" r="7" fill="#241a12"/>
      <circle cx="147.5" cy="136" r="2.4" fill="#fff"/>
    </g>

    <!-- ніс (боксерський, трохи широкий) -->
    <path d="M122 148 q6 8 12 0 q-2 8 -6 8 q-4 0 -6 -8z" fill="#c98a62"/>

    <!-- вуса -->
    <path d="M90 166 c8 -10 22 -12 34 -6 c3 1.5 4 4 4 4 c0 0 1 -2.5 4 -4 c12 -6 26 -4 34 6 c-9 2 -15 9 -21 13 c-8 5 -15 7 -17 7 c-2 0 -9 -2 -17 -7 c-6 -4 -12 -11 -21 -13z" fill="#2a1c14"/>

    <!-- щербата усмішка -->
    <path d="M104 182 q24 18 48 0 q-5 10 -24 13 q-19 -3 -24 -13z" fill="#7a4028"/>
    <path d="M112 184 q16 9 32 0 l-2 5 q-14 6 -28 0 z" fill="#fff"/>
    <path d="M127 184 v9" stroke="#7a4028" stroke-width="3" stroke-linecap="round"/>

    <!-- плечі: синьо-жовтий халат -->
    <path d="M40 256 V212 Q128 184 216 212 V256 Z" fill="url(#u-ua)"/>
    <path d="M96 208 q32 12 64 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".3"/>

    <!-- рукавички по кутах -->
    <ellipse cx="34" cy="222" rx="30" ry="26" fill="url(#u-glove)" stroke="#c06800" stroke-width="3"/>
    <ellipse cx="222" cy="222" rx="30" ry="26" fill="url(#u-glove)" stroke="#c06800" stroke-width="3"/>
    <path d="M20 212 q14 -10 28 0" fill="none" stroke="#fff3bf" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
    <path d="M208 212 q14 -10 28 0" fill="none" stroke="#fff3bf" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>

    <!-- блік на чолі -->
    <path d="M88 84 a52 40 0 0 1 40 -20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".22"/>
  </g>
</svg>
